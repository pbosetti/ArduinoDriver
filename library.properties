name=UsbIo
version=0.1.0
author=Paolo Bosetti
maintainer=Paolo Bosetti <paolo.bosetti@me.com>
sentence=Turns the board into a USB vendor-class I/O device (digital I/O, analog in, PWM, DAC) driven by a libusb host driver.
paragraph=Commands travel as USB control requests on endpoint 0 and are executed from loop(); no serial protocol is involved and the CDC Serial port stays free for debugging. Verified stacks: Arduino mbed (Portenta H7 on hardware; GIGA R1, Nano 33 BLE, Nano RP2040 Connect compile-checked), Renesas (UNO R4 Minima, Nano R4) and SAMD21 (Zero, MKR, Nano 33 IoT), both compile-checked. Unverified scaffolding: arduino-pico RP2040 and arduino-esp32 (USB-OTG mode).
category=Communication
url=https://github.com/pbosetti/ArduinoDriver
architectures=mbed,mbed_portenta,mbed_giga,mbed_nano,renesas_uno,samd,rp2040,esp32
includes=UsbIo.h
